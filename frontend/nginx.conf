server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Set Docker embedded DNS resolver to prevent Nginx failing if the backend is down momentarily
    resolver 127.0.0.11 valid=30s;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # proxy API requests to the Rust backend
    location /api/ {
        set $api_upstream http://backend:8080;
        proxy_pass $api_upstream$request_uri;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # proxy WebSocket connections
    location /ws {
        set $ws_upstream http://backend:8080;
        proxy_pass $ws_upstream$request_uri;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}