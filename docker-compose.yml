version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: stratbench-db
    environment:
      POSTGRES_USER: stratbench
      POSTGRES_PASSWORD: stratbench
      POSTGRES_DB: stratbench
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stratbench"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - stratbench-net

  redis:
    image: redis:7-alpine
    container_name: stratbench-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - stratbench-net

  finrl-service:
    build:
      context: ./python
      dockerfile: Dockerfile.finrl
    container_name: stratbench-finrl
    ports:
      - "50051:50051"
      - "50052:50052"
    environment:
      FINRL_GRPC_PORT: "50051"
      TRAINING_HTTP_PORT: "50052"
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://stratbench:stratbench@postgres:5432/stratbench
      MODELS_DIR: /models
      LOG_LEVEL: INFO
      PYTHONPATH: /app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./models:/models
    restart: unless-stopped
    networks:
      - stratbench-net

  backend:
    build:
      context: .
      dockerfile: backend/dockerfile
    container_name: stratbench-api
    environment:
      DATABASE_URL: postgres://stratbench:stratbench@postgres:5432/stratbench
      HOST: 0.0.0.0
      PORT: "8080"
      WORKERS: "4"
      DB_MAX_CONNECTIONS: "20"
      MAX_CONCURRENT_RUNS: "4"
      RUST_LOG: info,stratbench=debug
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET}
      ALPACA_BASE_URL: ${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}
      ALPACA_DATA_URL: ${ALPACA_DATA_URL:-https://data.alpaca.markets}
      FINRL_GRPC_ENDPOINT: http://finrl-service:50051
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      finrl-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - stratbench-net

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: stratbench-ui
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - stratbench-net

networks:
  stratbench-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
